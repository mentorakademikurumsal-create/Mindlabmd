<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş - MindLab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>MindLab</h2>
        <form id="login-form">
            <input type="text" id="login-name" placeholder="Kullanıcı Adı" required>
            <input type="password" id="login-password" placeholder="Şifre" required>
            <button type="submit" class="btn" style="margin-top:10px; width:100%;">Giriş Yap</button>
        </form>
        <p style="margin-top: 15px; text-align:center;">Hesabın yok mu? <a href="register.html">Kayıt Ol</a></p>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault(); // Sayfanın yenilenmesini engeller
            const username = document.getElementById('login-name').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('currentRole', data.role);
                    localStorage.setItem('userName', data.username);
                    localStorage.setItem('userGrade', data.grade);
                    window.location.href = data.role === 'Öğrenci' ? 'dashboard.html' : 'coach_dashboard.html';
                } else {
                    alert('Giriş başarısız: ' + (data.detail || 'Bilinmeyen hata'));
                }
            } catch (err) {
                alert('Sunucuya bağlanılamadı!');
            }
        });
    </script>
</body>
</html>
