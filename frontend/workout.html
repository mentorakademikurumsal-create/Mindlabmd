<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindLab - Sonsuz Zihin Antrenmanı</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .meta-tags { padding: 10px 20px; background: #f4f6f7; font-size: 11px; color: #7f8c8d; border-bottom: 1px solid #eaeded; display: flex; gap: 5px; flex-wrap: wrap;}
        .tag { background: #e5e8e8; color: #34495e; padding: 3px 8px; border-radius: 12px; font-weight: bold;}
        
        /* Hata Dedektifi Styles */
        .math-context { padding: 20px; font-size: 15px; line-height: 1.5; border-bottom: 2px dashed #eee; }
        .solution-area { padding: 20px; }
        .step { 
            background: #fff; padding: 15px; margin-bottom: 10px; border-radius: 8px; 
            border: 2px solid #eee; cursor: pointer; transition: 0.2s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .step:hover { border-color: #3498db; }
        .step.selected { background: #ffebee; border-color: #e74c3c; }
        .step.correct { background: #e8f5e9; border-color: #2ecc71; }
        .bug-icon { opacity: 0; color: #e74c3c; }
        .step:hover .bug-icon { opacity: 0.5; }
        .step.selected .bug-icon { opacity: 1; }

        /* Fosforlu Kalem Styles */
        .reading-area { padding: 25px; line-height: 1.8; font-size: 16px; color: #34495e; }
        .sentence { padding: 2px 0; cursor: pointer; transition: background-color 0.3s; border-radius: 4px; }
        .sentence:hover { background-color: #f1f8ff; }
        .sentence.highlighted { background-color: #fff3cd; }
        .sentence.correct { background-color: #d4edda; }
        .sentence.wrong { background-color: #f8d7da; }
        
        /* Shared Action Btn */
        .floating-action {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #2ecc71; color: white; padding: 15px 30px;
            border-radius: 30px; font-weight: bold; cursor: pointer; display: none; border: none; font-size: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 50;
        }

        /* Results Popup */
        .results-popup {
            position: absolute; bottom: 0; width: 100%; height: 50%; background: white;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.15); border-radius: 20px 20px 0 0;
            padding: 30px 20px; z-index: 100; display: flex; flex-direction: column; justify-content: space-between;
            transform: translateY(100%); transition: transform 0.3s ease-out;
        }
        .results-popup.show { transform: translateY(0); }
        .results-popup h2 { font-size: 22px; margin-bottom: 10px; }
        .results-popup p { font-size: 15px; line-height: 1.5; color: #555; }
        
        .next-btn {
            background-color: #2193b0; color: white; border: none; padding: 15px;
            border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer;
            width: 100%; margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Hedef Belirleme Modalı -->
    <div id="goal-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px);">
        <div style="background: white; padding: 30px; border-radius: 15px; width: 85%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
            <i class="fas fa-bullseye" style="font-size: 40px; color: #e74c3c; margin-bottom: 15px;"></i>
            <h2 style="margin-bottom: 10px; color: #2c3e50;">Günlük Antrenman Hedefi</h2>
            <p style="color: #7f8c8d; font-size: 14px; margin-bottom: 20px;">Bugün minimum kaç zihin egzersizi tamamlamak istiyorsun?</p>
            <input type="number" id="goal-input" value="5" min="1" max="50" style="width: 100px; font-size: 24px; text-align: center; padding: 10px; border: 2px solid #bdc3c7; border-radius: 10px; margin-bottom: 20px;">
            <br>
            <button id="start-workout-btn" style="background: #2ecc71; color: white; border: none; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 30px; cursor: pointer; width: 100%; box-shadow: 0 4px 15px rgba(46,204,113,0.3);">Antrenmana Başla <i class="fas fa-play"></i></button>
        </div>
    </div>

    <div class="app-container" style="position: relative; overflow: hidden; padding-bottom: 80px;">
        <header style="background: linear-gradient(135deg, #2c3e50, #3498db); color: white; padding: 15px; text-align: center;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <i class="fas fa-arrow-left" style="cursor:pointer;" onclick="window.location.href='dashboard.html'"></i>
                <h1 style="font-size: 18px; margin: 0;">MindLab Workout</h1>
                <div style="display: flex; gap: 15px;">
                    <i class="fas fa-robot" id="ai-force-btn" style="cursor:pointer; color: #f1c40f;" title="Yapay Zekadan Soru İste"></i>
                    <i class="fas fa-ellipsis-v"></i>
                </div>
            </div>
            <!-- Progress Bar -->
            <div style="width: 100%; background: rgba(255,255,255,0.2); height: 8px; border-radius: 4px; overflow: hidden; margin-top: 5px;">
                <div id="progress-bar-fill" style="width: 0%; height: 100%; background: #2ecc71; transition: width 0.4s ease;"></div>
            </div>
            <div id="progress-text" style="font-size: 12px; margin-top: 5px; opacity: 0.8;">Hedef: -</div>
        </header>

        <!-- Dinamik İçerik Buraya Gelecek -->
        <div id="workout-canvas" style="flex:1; overflow-y: auto;"></div>

        <!-- Evrensel Onay Butonu (Bazı modüllerde çıkar) -->
        <button class="floating-action" id="universal-submit-btn">Onayla</button>

        <!-- Evrensel Sonuç Ekranı -->
        <div class="results-popup" id="results-popup">
            <div>
                <h2 id="feedback-title">Sonuç</h2>
                <p id="feedback-desc">Geri bildirim metni.</p>
            </div>
            <button class="next-btn" id="next-task-btn">Sonraki Soruya Geç <i class="fas fa-arrow-right"></i></button>
        </div>
    </div>

    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <!-- Firebase Firestore -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    
    <script src="firebase-service.js"></script>
    
    <script src="workout.js"></script>
</body>
</html>
