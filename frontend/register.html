<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kayıt Ol - MindLab</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Sadece bu sayfadaki yeni kutuları diğerleriyle uyumlu hale getiren makyaj */
        .login-container select, 
        .login-container input[type="number"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
            font-family: inherit;
            background-color: #fff;
        }
        .login-container select:focus, 
        .login-container input[type="number"]:focus {
            outline: none;
            border-color: #3498db;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>MindLab'a Katıl</h2>
        <form id="register-form">
            <input type="text" id="reg-name" placeholder="Kullanıcı Adı" required>
            <input type="password" id="reg-password" placeholder="Şifre" required>
            <select id="reg-role" required>
                <option value="Öğrenci">Öğrenci</option>
                <option value="Koç">Eğitim Koçu</option>
            </select>
            <input type="number" id="reg-grade" placeholder="Sınıfınız (Örn: 7)" value="7" min="1" max="12" required>
            <button type="submit" class="btn" style="margin-top:10px; width:100%;">Kayıt Ol</button>
        </form>
        <p style="margin-top: 15px; text-align:center;">Zaten hesabın var mı? <a href="index.html">Giriş Yap</a></p>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('reg-name').value;
            const password = document.getElementById('reg-password').value;
            const role = document.getElementById('reg-role').value;
            const grade = parseInt(document.getElementById('reg-grade').value) || 7;

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role, grade })
                });
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('currentRole', data.role);
                    localStorage.setItem('userName', data.username);
                    localStorage.setItem('userGrade', data.grade);
                    window.location.href = data.role === 'Öğrenci' ? 'dashboard.html' : 'coach_dashboard.html';
                } else {
                    alert('Kayıt başarısız: ' + (data.detail || 'Bilinmeyen hata'));
                }
            } catch (err) {
                alert('Sunucuya bağlanılamadı!');
            }
        });
    </script>
</body>
</html>
